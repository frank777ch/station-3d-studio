<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vape 3D Studio</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }
      body {
        background: radial-gradient(ellipse at 50% 40%, #2a2d33 0%, #15171a 55%, #0b0c0e 100%);
        color: #ddd;
      }
      #app { display: block; width: 100%; height: 100%; }
      #hud {
        position: fixed; left: 16px; bottom: 14px; font-size: 12px; opacity: .7;
        pointer-events: none; user-select: none; line-height: 1.5;
      }
      #hud b { color: #fff; }
      .lil-gui { --width: 330px; --font-size: 12px; }

      /* Catálogo lateral */
      #catalog {
        position: fixed; left: 12px; top: 12px; width: 270px; max-height: calc(100vh - 90px);
        display: flex; flex-direction: column; background: rgba(20, 22, 26, .92); border: 1px solid #2c3037;
        border-radius: 10px; color: #ddd; font-size: 13px; overflow: hidden; backdrop-filter: blur(6px);
      }
      .cat-head { padding: 10px; border-bottom: 1px solid #2c3037; }
      #cat-search {
        width: 100%; box-sizing: border-box; padding: 8px 10px; border-radius: 6px; border: 1px solid #3a3f47;
        background: #0f1114; color: #fff; font-size: 13px; outline: none;
      }
      #cat-search:focus { border-color: #5aa8ff; }
      .cat-count { margin-top: 6px; font-size: 11px; opacity: .55; }
      .cat-list { overflow-y: auto; padding: 6px; }
      .cat-group-title {
        width: 100%; display: flex; align-items: center; gap: 6px; background: none; border: 0; color: #fff;
        font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; padding: 8px 6px 4px; cursor: pointer; text-align: left;
      }
      .cat-group-title .chev { width: 10px; opacity: .6; }
      .cat-group-title .n { margin-left: auto; opacity: .45; font-weight: 500; }
      .cat-item {
        width: 100%; display: flex; align-items: center; gap: 8px; background: none; border: 0; color: #ddd;
        padding: 6px 8px; border-radius: 6px; cursor: pointer; text-align: left; font-size: 13px;
      }
      .cat-item:hover { background: #262a31; }
      .cat-item.active { background: #1f3a5f; color: #fff; }
      .cat-item .sw { width: 14px; height: 22px; border-radius: 4px; flex: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,.15); }
      .cat-item .nm { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .cat-item .tag { font-size: 10px; opacity: .5; border: 1px solid #555; border-radius: 4px; padding: 0 4px; }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="hud"><b id="hud-name">…</b><br /><span id="hud-status">cargando entorno…</span></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
